@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Outfit:wght@400;500;600&display=swap");
*{box-sizing:border-box;margin:0;padding:0}
:root{--marca:#8F4A1F;--fundo:#FBF4E8;--fundo2:#F3E6D2;--sup:#FFFBF4;--tinta:#3A2314;--suave:#745A47;--linha:#E6D3BB;--creme:#FDEFD8;--f-tit:Fraunces,ui-serif,Georgia,serif;--f-txt:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;--r:22px}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--fundo);color:var(--tinta);font:17px/1.55 var(--f-txt);-webkit-font-smoothing:antialiased}
.w{max-width:1160px;margin:auto;padding:0 clamp(18px,4vw,40px)}
.hero{background:radial-gradient(60% 90% at 85% 0%,rgb(224 150 70/.35),transparent 70%),radial-gradient(50% 70% at 5% 100%,rgb(60 25 5/.45),transparent 70%),linear-gradient(160deg,#5E2C0B,#8F4A1F 58%,#A9611F);color:var(--creme);text-align:center;position:relative;overflow:hidden;isolation:isolate;padding:clamp(22px,3.2vw,34px) 0 clamp(30px,4.2vw,46px);border-radius:0 0 clamp(26px,4vw,48px) clamp(26px,4vw,48px)}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:opacity .45s}
.vid.troca{opacity:0}
.hero.cv::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgb(55 25 6/.5),rgb(55 25 6/.64))}
.hero .w{position:relative}
.hero.cv p,.hero.cv small{text-shadow:0 1px 8px rgb(30 12 2/.45)}
.hero img{width:min(330px,62vw);height:auto;display:block;margin:0 auto}
.hero p{max-width:40em;margin:14px auto 0;font:italic 500 clamp(17px,2vw,22px)/1.35 var(--f-tit);color:var(--creme)}
@media(min-width:900px){.hero p span{display:block}}
.hero small{display:block;margin-top:6px;font-size:14px;opacity:.85}
.filtros{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px 0 0}
.chip{font:500 16px/1 var(--f-txt);padding:12px 20px;border-radius:999px;border:1px solid var(--linha);background:var(--sup);color:var(--tinta);cursor:pointer}
.chip[aria-pressed=true]{background:var(--marca);border-color:var(--marca);color:var(--creme)}
.chip:focus-visible,.card:focus-visible{outline:3px solid var(--marca);outline-offset:3px}
.grade{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));padding:20px 0 56px}
.card{display:flex;flex-direction:column;background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgb(90 44 11/.14)}
.foto{position:relative;aspect-ratio:1;background:linear-gradient(150deg,var(--fundo2),#E8D2B4)}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.loja{position:absolute;left:12px;top:12px;padding:5px 12px;border-radius:999px;background:rgb(253 239 216/.94);color:var(--marca);font-size:13px;font-weight:600}
.corpo{display:flex;flex-direction:column;flex:1;padding:20px 20px 22px}
.cat{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--marca);margin-bottom:6px}
h3{font:500 21px/1.25 var(--f-tit);letter-spacing:-.01em}
.corpo p{margin-top:8px;color:var(--suave);font-size:15.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rodape-card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:18px}
.rodape-card b{font:500 24px/1 var(--f-tit)}
.ir{padding:11px 18px;border-radius:999px;background:var(--marca);color:var(--creme);font-weight:600;font-size:15px;white-space:nowrap}
.rodape-card .ir:only-child{width:100%;text-align:center}
.card:hover .ir{filter:brightness(1.1)}
.vazio{grid-column:1/-1;text-align:center;color:var(--suave);padding:40px 0}
.aviso{background:var(--fundo2);padding:34px 0;text-align:center;font-size:15px;color:var(--suave)}
.aviso b{display:block;font:italic 500 22px var(--f-tit);color:var(--tinta);margin-bottom:8px}
.aviso p{max-width:none;margin:auto;font-size:13px}
@media(min-width:760px){.aviso p{white-space:nowrap}}
.insta{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:9px 18px;border-radius:999px;border:1.5px solid var(--marca);color:var(--marca);text-decoration:none;font:600 15px var(--f-txt)}
.insta:hover{background:var(--marca);color:var(--creme)}
@media(max-width:600px){.grade{grid-template-columns:repeat(2,1fr);gap:12px}.corpo{padding:14px 14px 16px}h3{font-size:17px}.corpo p{font-size:14px;-webkit-line-clamp:2}.rodape-card{flex-direction:column;align-items:flex-start}.rodape-card b{font-size:20px}.ir{width:100%;text-align:center;padding:10px}}

.lnk{background:none;border:0;color:var(--suave);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;margin-top:14px}
#admin{position:fixed;inset:0;z-index:50;background:var(--fundo);overflow:auto;padding:0 0 60px}
#admin[hidden]{display:none}
.ad-top{position:sticky;top:0;z-index:2;background:var(--tinta);color:var(--creme);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ad-top b{font:500 20px var(--f-tit)}
.ad-top div{display:flex;gap:8px;flex-wrap:wrap}
.bt{font:600 15px var(--f-txt);padding:11px 18px;border-radius:999px;border:1px solid var(--marca);background:var(--marca);color:var(--creme);cursor:pointer}
.bt.sec{background:transparent;color:inherit;border-color:currentColor}
.bt[disabled]{opacity:.45;cursor:default}
.ad-msg{max-width:960px;margin:16px auto 0;padding:12px 18px;border-radius:14px;background:var(--fundo2);font-size:15px}
.ad-g{max-width:960px;margin:0 auto;padding:20px 18px;display:grid;gap:28px}
@media(min-width:860px){.ad-g{grid-template-columns:1fr 1fr}}
.ad-g h2{font:500 24px var(--f-tit);margin-bottom:14px}
#f{display:grid;gap:12px}
#f label{display:grid;gap:5px;font-size:14px;font-weight:600;color:var(--suave)}
#f input,#f textarea,#f select{font:400 16px var(--f-txt);padding:11px 13px;border-radius:12px;border:1px solid var(--linha);background:var(--sup);color:var(--tinta);width:100%}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:min(92vw,560px);background:var(--tinta);color:var(--creme);padding:14px 20px;border-radius:16px;font-size:15px;line-height:1.4;z-index:60;box-shadow:0 10px 30px rgb(30 12 2/.35)}
#toast[hidden]{display:none}
#pubf{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;padding:14px 22px;font-size:16px;box-shadow:0 10px 26px rgb(30 12 2/.35)}
#pubf[hidden]{display:none}
#prev{width:110px;height:110px;object-fit:cover;border-radius:14px;border:1px solid var(--linha)}
.lin{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--linha);border-radius:16px;background:var(--sup);margin-bottom:10px}
.lin img,.lin i{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--fundo2)}
.lin span{display:block;font-size:13px;color:var(--suave)}
.lin strong{font:500 17px var(--f-tit)}
.acs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.acs button{font:600 13px var(--f-txt);padding:7px 12px;border-radius:999px;border:1px solid var(--linha);background:var(--fundo);color:var(--tinta);cursor:pointer}
</style>
</head>

const grade=$('#grade'),filtros=$('#filtros'),adm=$('#admin');
function card(p){
 const img=p.img?`<img src="${esc(p.img)}" alt="${esc(p.nome)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
 return `<a class="card" href="${esc(p.link)}" target="_blank" rel="sponsored noopener noreferrer"><div class="foto">${img}${p.loja?`<span class="loja">${esc(p.loja)}</span>`:''}</div><div class="corpo">${p.cat?`<span class="cat">${esc(p.cat)}</span>`:''}<h3>${esc(p.nome)}</h3>${p.desc?`<p>${esc(p.desc)}</p>`:''}<div class="rodape-card">${p.preco?`<b>${esc(p.preco)}</b>`:''}<span class="ir">Ver na loja</span></div></div></a>`;
}
function desenhar(){
 const cats=['Todos',...new Set(produtos.map(p=>p.cat).filter(Boolean))];
 if(!cats.includes(ativo))ativo='Todos';
 filtros.hidden=cats.length<3;
 filtros.innerHTML=cats.map(c=>`<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${c===ativo}">${esc(c)}</button>`).join('');
 const l=produtos.filter(p=>ativo==='Todos'||p.cat===ativo);
 grade.innerHTML=l.length?l.map(card).join(''):'<p class="vazio">Novas escolhas chegando em breve.</p>';
}
addEventListener('hashchange',()=>{if(pode&&location.hash==='#admin')abrirPainel();});
$('#marca').addEventListener('click',()=>{clearTimeout(tt);tt=setTimeout(()=>toques=0,2500);if(++toques>=5&&pode){toques=0;abrirPainel();}});
filtros.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){ativo=b.dataset.c;desenhar();}});
desenhar();

/* ---------- Painel (só aparece para quem pode editar a página) ---------- */
function abrirPainel(){
 adm.hidden=false;
 adm.innerHTML=`<div class="ad-top"><b>Painel · Casa Terra Soul</b><div><button class="bt" id="pub" disabled>Publicar no catálogo</button><button class="bt sec" id="fechar">Fechar</button></div></div>
 <p class="ad-msg" id="msg">Cadastre os produtos e clique em “Publicar no catálogo” para eles aparecerem para todo mundo.</p>
 <div class="ad-g"><section><h2 id="ft">Novo produto</h2>
 <form id="f"><label>Nome do produto<input name="nome" required maxlength="90"></label>
 <label>Descrição<textarea name="desc" rows="3" maxlength="240"></textarea></label>
 <div class="duas"><label>Valor<input name="preco" required placeholder="R$ 89,90"></label>
 <label>Loja<select name="loja"><option>Shopee</option><option>Mercado Livre</option><option>Outra</option></select></label></div>
 <label>Categoria<input name="cat" list="cats" placeholder="Morar, Sentir, Descobrir ou Viver"></label>
 <datalist id="cats"><option>Morar</option><option>Sentir</option><option>Descobrir</option><option>Viver</option></datalist>
 <label>Link de afiliada<input name="link" type="url" required placeholder="https://..."></label>
 <label>Imagem do produto (envie o arquivo ou cole com Ctrl+V)<input name="arq" type="file" accept="image/*"></label>
 <label>ou cole o link da imagem<input name="img" type="url" placeholder="https://... (só aparece com a página hospedada fora daqui)"></label>
 <img id="prev" alt="" hidden>
 <div class="acs"><button class="bt" type="submit">Salvar produto</button><button class="bt sec" type="button" id="canc" hidden>Cancelar edição</button></div></form></section>
 <section><h2>Importar planilha</h2><p class="ad-msg" style="margin:0 0 12px">Envie um arquivo Excel (.xlsx) ou CSV com uma linha por produto. Colunas reconhecidas pelo título: link, nome, descrição, valor, categoria, loja e imagem. Produtos com o mesmo link são atualizados; links novos entram como produtos novos.</p><input id="pup" type="file" accept=".xlsx,.xls,.csv"><h2 style="margin-top:28px">Produtos cadastrados</h2><div id="lista"></div>
<h2 style="margin-top:28px">Vídeos do topo</h2><p class="ad-msg" style="margin:0 0 12px">Vídeos curtos (5 a 10 segundos), na horizontal, até 20 MB cada, em MP4. Use só vídeos seus ou de bancos gratuitos que liberem uso comercial.</p><input id="vup" type="file" accept="video/mp4,video/webm"><div id="vlista" style="margin-top:12px"></div></section></div>`;
 $('#fechar').onclick=()=>{adm.hidden=true;adm.innerHTML='';};
 $('#pub').onclick=publicar;$('#canc').onclick=limpar;
 $('#f').onsubmit=salvar;
 $('#f').arq.onchange=lerImagem;$('#vup').onchange=subirVideo;$('#pup').onchange=importar;vlista();
 lista();barra();
}
function msg(t,q){const m=$('#msg');if(m)m.textContent=t;if(q||!adm||adm.hidden)return;let d=$('#toast');if(!d){d=document.createElement('div');d.id='toast';adm.appendChild(d);}d.textContent=t;d.hidden=false;clearTimeout(window._tm);window._tm=setTimeout(()=>{d.hidden=true;},9000);}
function barra(){const b=$('#pub');if(b)b.disabled=!sujo;let f=$('#pubf');if(!f&&adm&&!adm.hidden){f=document.createElement('button');f.id='pubf';f.type='button';f.className='bt';f.textContent='Publicar no catálogo';f.onclick=publicar;adm.appendChild(f);}if(f)f.hidden=!sujo;if(sujo)msg('Você tem alterações não publicadas. Clique em “Publicar no catálogo”.',1);}
function limpar(){editId=null;imgAtual='';const f=$('#f');f.reset();$('#prev').hidden=true;$('#canc').hidden=true;$('#ft').textContent='Novo produto';}
function lerImagem(e){
 const a=e.target.files[0];if(!a)return;
 const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
  const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');
  c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);
  imgAtual=c.toDataURL('image/jpeg',.82);const p=$('#prev');p.src=imgAtual;p.hidden=false;};i.src=r.result;};
 r.readAsDataURL(a);
}
function salvar(e){
 e.preventDefault();const f=e.target;
 const link=f.link.value.trim();
 if(!/^https?:\/\//i.test(link)){msg('O link de afiliada precisa começar com https://');return;}
 const p={id:editId||'p'+Date.now(),nome:f.nome.value.trim(),desc:f.desc.value.trim(),preco:f.preco.value.trim(),loja:f.loja.value,cat:f.cat.value.trim(),link,img:imgAtual||f.img.value.trim()};
 const i=produtos.findIndex(x=>x.id===p.id);
 if(i>=0)produtos[i]=p;else produtos.push(p);
 sujo=true;limpar();lista();desenhar();barra();
}
function editar(id){
 const p=produtos.find(x=>x.id===id),f=$('#f');if(!p)return;
 editId=id;imgAtual=p.img&&p.img.startsWith('data:')?p.img:'';
 ['nome','desc','preco','loja','cat','link'].forEach(k=>f[k].value=p[k]||'');
 f.img.value=p.img&&!p.img.startsWith('data:')?p.img:'';
 const pv=$('#prev');pv.hidden=!p.img;pv.src=p.img||'';
 $('#canc').hidden=false;$('#ft').textContent='Editar produto';f.scrollIntoView({behavior:'smooth'});
}
function lista(){
 const l=$('#lista');if(!l)return;
 l.innerHTML=produtos.length?produtos.map((p,i)=>`<div class="lin">${p.img?`<img src="${esc(p.img)}" alt="">`:'<i></i>'}<div><strong>${esc(p.nome)}</strong><span>${esc(p.preco)} · ${esc(p.loja)}${p.cat?' · '+esc(p.cat):''}</span></div><div class="acs"><button data-a="up" data-i="${i}">▲</button><button data-a="dn" data-i="${i}">▼</button><button data-a="ed" data-i="${p.id}">Editar</button><button data-a="rm" data-i="${p.id}">${confirma===p.id?'Confirmar exclusão':'Excluir'}</button></div></div>`).join(''):'<p class="ad-msg">Nenhum produto ainda.</p>';
}
document.addEventListener('click',e=>{
 const b=e.target.closest('#lista button');if(!b)return;
 const a=b.dataset.a,i=b.dataset.i;
 if(a==='ed')return editar(i);
 if(a==='up'||a==='dn'){const n=+i,m=a==='up'?n-1:n+1;if(m<0||m>=produtos.length)return;[produtos[n],produtos[m]]=[produtos[m],produtos[n]];}
 if(a==='rm'){if(confirma!==i){confirma=i;setTimeout(()=>{confirma=null;lista();},3500);return lista();}produtos=produtos.filter(x=>x.id!==i);confirma=null;}
 sujo=true;lista();desenhar();barra();
});
let videos=JSON.parse($('#videos').textContent);
function tocarVideos(){
 const h=$('#vid');
 if(!videos.length||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 let i=0;h.muted=true;h.src=videos[0].url;h.loop=videos.length===1;h.hidden=false;h.parentElement.classList.add('cv');h.play().catch(()=>{});
 h.onended=()=>{h.classList.add('troca');setTimeout(()=>{i=(i+1)%videos.length;h.src=videos[i].url;h.play().catch(()=>{});h.classList.remove('troca');},450);};
}
tocarVideos();
function vlista(){
 const l=$('#vlista');if(!l)return;
 l.innerHTML=videos.length?videos.map((v,i)=>`<div class="lin" style="grid-template-columns:1fr auto"><strong>Vídeo ${i+1}</strong><div class="acs"><button type="button" data-v="${i}">Remover</button></div></div>`).join(''):'<p class="ad-msg">Nenhum vídeo ainda: o topo usa só a cor da marca.</p>';
}
async function subirVideo(e){
 const a=e.target.files[0];e.target.value='';if(!a)return;
 if(a.size>20*1024*1024){msg('Esse vídeo passa de 20 MB. Reduza o tamanho e envie de novo.');return;}
 const as=await claude.use('assets');
 if(!as){msg('Não foi possível enviar vídeos daqui.');return;}
 msg('Enviando vídeo…');
 try{const r=await as.upload(a);videos.push({id:r.id,url:r.url});sujo=true;vlista();barra();}
 catch(err){msg('Não consegui enviar o vídeo. Tente um arquivo MP4 menor.');}
}
document.addEventListener('paste',e=>{if(adm.hidden||!$('#f'))return;const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(x=>x.type.startsWith('image/'));if(it){lerImagem({target:{files:[it.getAsFile()]}});msg('Imagem colada. Preencha o resto e clique em “Salvar produto”.');}});
document.addEventListener('click',e=>{const b=e.target.closest('#vlista button');if(!b)return;videos.splice(+b.dataset.v,1);sujo=true;vlista();barra();});
function carregarXLSX(){return new Promise((ok,no)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.id='sheetjs';s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function importar(e){
 const a=e.target.files[0];e.target.value='';if(!a)return;
 msg('Lendo a planilha…');try{await carregarXLSX();}catch(x){msg('Não consegui carregar o leitor de planilhas. Verifique a internet e tente de novo.');return;}
 try{
  const wb=/\.csv$/i.test(a.name)?XLSX.read(await a.text(),{type:'string'}):XLSX.read(await a.arrayBuffer(),{type:'array'});
  const linhas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const cab=(linhas[0]||[]).map(norm);
  const col={link:cab.findIndex(c=>/link|url|afiliad/.test(c)&&!/imag|foto/.test(c))};
  col.nome=cab.findIndex((c,i)=>i!==col.link&&/nome|titulo|produto/.test(c)&&!/link|url/.test(c));
  col.desc=cab.findIndex(c=>/descri/.test(c));col.preco=cab.findIndex(c=>/valor|preco|price/.test(c));
  col.cat=cab.findIndex(c=>/categ/.test(c));col.loja=cab.findIndex(c=>/loja|marketplace|plataforma/.test(c));
  col.img=cab.findIndex(c=>/imag|foto/.test(c));
  if(col.link<0){msg('Não achei a coluna do link de afiliada. Na primeira linha da planilha, dê o título “Link” à coluna dos links.');return;}
  const chave=u=>String(u).trim().replace(/\/+$/,'').toLowerCase();
  let novos=0,atual=0,ign=0;
  for(const r of linhas.slice(1)){
   const g=i=>i<0?'':(typeof r[i]==='number'?r[i]:String(r[i]==null?'':r[i]).trim());
   const link=String(g(col.link)).trim();
   if(!/^https?:\/\//i.test(link)){if(r.some(c=>String(c).trim()))ign++;continue;}
   let preco=g(col.preco);
   if(typeof preco==='number')preco='R$ '+preco.toFixed(2).replace('.',',');else if(/^\d/.test(preco))preco='R$ '+preco;
   const cp={nome:String(g(col.nome)),desc:String(g(col.desc)),preco:String(preco),cat:String(g(col.cat)),loja:String(g(col.loja)),img:String(g(col.img))};
   const ex=produtos.find(p=>chave(p.link)===chave(link));
   if(ex){Object.keys(cp).forEach(k=>{if(!cp[k])return;if(k==='img'&&String(ex.img||'').startsWith('data:'))return;ex[k]=cp[k];});ex.link=link;atual++;}
   else{
    if(!cp.loja)cp.loja=/shopee|shp\.ee/i.test(link)?'Shopee':/mercadoli|meli\.la/i.test(link)?'Mercado Livre':'Outra';
    if(!cp.nome)cp.nome='Produto sem nome (edite no Painel)';
    produtos.push({id:'p'+Date.now()+'_'+(novos+atual),link,...cp});novos++;
   }
  }
  if(novos||atual)sujo=true;
  lista();desenhar();barra();
  msg('Importação concluída: '+novos+' novos, '+atual+' atualizados'+(ign?', '+ign+' linhas ignoradas (sem link válido)':'')+'. Clique em “Publicar no catálogo” para o site atualizar.');
 }catch(err){msg('Não consegui ler esse arquivo. Salve a planilha como .xlsx ou .csv e tente de novo. ('+(err&&err.message||err)+')');}
}
async function publicar(){
 const art=await claude.use('artifact');
 if(!art){msg('Não foi possível publicar daqui. Abra a página pela sua conta do Claude.');return;}
 const c=document.documentElement.cloneNode(true);
 c.querySelector('#grade').innerHTML='';c.querySelector('#filtros').innerHTML='';
 const a=c.querySelector('#admin');a.innerHTML='';a.setAttribute('hidden','');
 
 const sj=c.querySelector('#sheetjs');if(sj)sj.remove();c.querySelector('#videos').textContent=JSON.stringify(videos);const vv=c.querySelector('#vid');vv.removeAttribute('src');vv.removeAttribute('loop');vv.className='vid';vv.setAttribute('hidden','');vv.parentElement.classList.remove('cv');c.querySelector('#dados').textContent=JSON.stringify(produtos).replace(/</g,'\\u003c');
 $('#pub').disabled=true;const pf=$('#pubf');if(pf)pf.disabled=true;msg('Publicando…');
 try{await art.publish('<!doctype html>\n'+c.outerHTML);}
 catch(e){const k=e&&e.code;msg(k==='not_writer'||k==='not_granted'?'Só quem edita a página pode publicar.':k==='conflict'?'A página foi atualizada em outro lugar. Ela vai recarregar.':'Não consegui publicar. Tente de novo.');$('#pub').disabled=false;}
}
(async()=>{
 if(!window.claude||!claude.use)return;
 try{const [u,a]=await Promise.all([claude.use('user'),claude.use('artifact')]);
  if(u&&a&&await u.canEdit()){pode=true;if(location.hash==='#admin')abrirPainel();}}catch(e){}
})();
</script>
